# idp-infra CI: static checks on every push and PR (PLATFORM_REVIEW F7).
#   fmt       terraform fmt -check
#   validate  every layer, with the committed provider lock files (init -backend=false: no AWS access)
#   tflint    recommended preset; fails on errors, reports warnings
#   trivy     IaC misconfigurations HIGH/CRITICAL; accepted exceptions live in .trivyignore.yaml
# Next step (needs a read-only OIDC role in 00-bootstrap): `terraform plan` per layer on PRs.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate
        run: |
          for layer in 00-bootstrap 10-network 15-registry 20-data 30-cluster 40-platform; do
            echo "::group::$layer"
            terraform -chdir=$layer init -backend=false -input=false -lockfile=readonly >/dev/null
            terraform -chdir=$layer validate -no-color
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml   # YAML format (per-path exceptions with reasons)
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  # Read-only plan of the PERMANENT layers (the others are destroyed between sessions).
  # PR: shows the change in the job summary. main: a non-empty plan = drift (AWS != code)
  # or a merged change nobody applied yet -> fail. Role idp-infra-plan lives in 00-bootstrap.
  plan:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        layer: [10-network, 15-registry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::693906847772:role/idp-infra-plan
          aws-region: ap-south-1
      - name: Expose the OIDC credentials as profile "idp" (backend + provider pin that profile)
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile idp
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile idp
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile idp
      - name: terraform plan (${{ matrix.layer }})
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          terraform -chdir="$LAYER" init -input=false -lockfile=readonly >/dev/null
          set +e
          terraform -chdir="$LAYER" plan -lock=false -input=false -no-color -detailed-exitcode > plan.txt
          rc=$?
          set -e
          { echo "### $LAYER"; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -eq 1 ]; then cat plan.txt; exit 1; fi
          if [ $rc -eq 2 ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::$LAYER: main differs from AWS (drift, or a merged change not applied yet)"; exit 1
          fi
          grep -E '^Plan:|No changes' plan.txt || true
